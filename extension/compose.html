<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ThunderQuail compose</title>
  <link rel="stylesheet" href="ui.css">
  <script type="module" src="compose.mjs"></script>
</head>
<body class="popup compose">
  <header class="compose-header">
    <img src="overlay/quail.svg" width="24" height="24" alt="">
    <h1>ThunderQuail compose</h1>
  </header>
  <main>
    <p id="provider" class="compose-privacy-note" hidden></p>
    <fieldset id="selection-tools" hidden>
      <legend>Rewrite selection</legend>
      <div class="rewrite-actions">
        <button type="button" aria-pressed="false" data-rewrite="Improve clarity and flow while preserving the meaning.">Rewrite</button>
        <button type="button" aria-pressed="false" data-rewrite="Shorten the text while keeping all essential information.">Shorten</button>
        <button type="button" aria-pressed="false" data-rewrite="Use a formal tone.">Formal</button>
        <button type="button" aria-pressed="false" data-rewrite="Use a friendly tone.">Friendly</button>
        <button type="button" aria-pressed="false" data-rewrite="Use a concise tone.">Concise</button>
      </div>
      <form id="translate-form">
        <label for="translation-language">Translate to</label>
        <div class="translate-row">
          <input id="translation-language" type="text" maxlength="80" placeholder="e.g., Greek, French…">
          <button id="translate-selection" type="submit">Translate</button>
        </div>
      </form>
    </fieldset>
    <form id="generate">
      <label for="mode">Action</label>
      <select id="mode">
        <option value="draft">Draft from a prompt</option>
        <option value="selection" disabled>Rewrite selected text</option>
        <option value="body">Rewrite entire draft</option>
      </select>
      <label for="instruction">Instructions</label>
      <textarea id="instruction" rows="3" placeholder="Additional instructions (optional)"></textarea>
      <button id="generate-button" type="submit" disabled>Generate preview</button>
    </form>
    <section id="compose-privacy-review" aria-labelledby="compose-privacy-title" hidden>
      <h2 id="compose-privacy-title">Review redacted request</h2>
      <p id="compose-privacy-warning"></p>
      <pre id="compose-privacy-preview" tabindex="0"></pre>
      <button id="compose-privacy-cancel" type="button">Cancel</button>
      <button id="compose-privacy-confirm" type="button">Send redacted text</button>
    </section>
    <section id="preview-section" hidden>
      <label for="preview">Preview</label>
      <textarea id="preview" rows="6"></textarea>
    </section>
    <footer class="compose-footer">
      <button id="apply" type="button" hidden>Apply to draft</button>
      <p id="status" role="status">Loading compose tools…</p>
    </footer>
  </main>
</body>
</html>
