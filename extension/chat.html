<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ThunderQuail chat</title>
  <link rel="stylesheet" href="ui.css">
  <script type="module" src="chat.mjs"></script>
</head>
<body class="chat">
  <main>
    <header class="controls">
      <h1>ThunderQuail chat</h1>
      <a href="settings.html" target="_blank" rel="noopener">Settings</a>
      <button id="clear" type="button">Clear chat</button>
    </header>
    <p id="provider"></p>
    <section id="transcript" aria-label="Conversation"></section>
    <form id="chat-form">
      <label for="prompt">Message</label>
      <textarea id="prompt" rows="4" required></textarea>
      <label class="mailbox-option">
        <input id="search-index" type="checkbox" aria-describedby="index-hint" disabled>
        Search indexed mail
      </label>
      <small id="index-hint">Set the local indexer URL and companion token in Settings to use indexed mail.</small>
      <div id="scope-controls" hidden>
        <label for="search-scope">Search scope</label>
        <select id="search-scope" aria-describedby="scope-status">
          <option value="all">All indexed mail</option>
        </select>
        <small id="scope-status" role="status"></small>
        <details id="index-coverage" hidden>
          <summary>Index coverage</summary>
          <ul id="coverage-warnings"></ul>
        </details>
      </div>
      <label class="mailbox-option">
        <input id="mailbox" type="checkbox" aria-describedby="mailbox-hint">
        Propose a mailbox action
      </label>
      <small id="mailbox-hint">Sends folder names and selected message subjects to the provider for this request.</small>
      <div class="controls">
        <button id="attach" type="button" disabled>Include email</button>
        <button id="remove" type="button" hidden>Remove email</button>
        <button id="send" type="submit" disabled>Send</button>
        <button id="stop" type="button" hidden>Stop</button>
      </div>
      <p id="attachment"></p>
      <p id="status" role="status">Loading settings…</p>
    </form>
  </main>
  <dialog id="confirm-mailbox" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Confirm mailbox action</h2>
      <p id="mailbox-description"></p>
      <div class="controls">
        <button value="cancel" autofocus>Cancel</button>
        <button value="apply">Apply action</button>
      </div>
    </form>
  </dialog>
</body>
</html>
