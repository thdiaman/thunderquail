<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ThunderQuail chat</title>
  <link rel="stylesheet" href="ui.css">
  <script type="module" src="chat.mjs"></script>
</head>
<body class="chat overlay-chat">
  <main>
    <header class="chat-toolbar">
      <label id="index-toggle" title="Configure the local indexer in Settings.">
        <input id="search-index" class="visually-hidden" type="checkbox" aria-label="Search indexed mail" checked disabled>
        <span class="index-dot" aria-hidden="true"></span>
        <span id="index-label">Search index</span>
      </label>
      <span id="model" class="model-chip" hidden></span>
      <button id="settings" type="button"><span aria-hidden="true">⚙</span> Settings</button>
    </header>
    <p id="attachment" class="mail-context" hidden aria-live="polite">
      <strong><span aria-hidden="true">✉</span> Context Mail:</strong> <span id="context-subject"></span>
    </p>
    <section id="transcript" aria-label="Conversation">
      <p class="chat-empty">Ask me about the selected email or your indexed mail.</p>
    </section>
    <form id="chat-form">
      <div class="composer-line">
        <label class="visually-hidden" for="prompt">Message</label>
        <textarea id="prompt" rows="1" placeholder="Ask about your mail…" required></textarea>
        <button id="send" type="submit" aria-label="Send" title="Send (Enter) · New line (Shift+Enter)" disabled>↑</button>
      </div>
      <p id="status" role="status">Loading settings…</p>
    </form>
  </main>
  <section id="confirm-mailbox" aria-labelledby="confirm-title" hidden>
      <h2 id="confirm-title">Confirm mailbox action</h2>
      <p id="mailbox-description"></p>
      <div class="controls">
        <button id="cancel-action" type="button">Cancel</button>
        <button id="apply-action" type="button">Apply action</button>
      </div>
  </section>
</body>
</html>
